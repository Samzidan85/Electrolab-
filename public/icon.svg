<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Outer Ring Accent -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Circuit Trace Accents -->
  <g stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.35">
    <path d="M 80 140 L 160 140 L 180 160" fill="none"/>
    <circle cx="80" cy="140" r="6" fill="#38bdf8"/>
    <path d="M 432 140 L 352 140 L 332 160" fill="none"/>
    <circle cx="432" cy="140" r="6" fill="#38bdf8"/>
    <path d="M 80 372 L 160 372 L 180 352" fill="none"/>
    <circle cx="80" cy="372" r="6" fill="#38bdf8"/>
    <path d="M 432 372 L 352 372 L 332 352" fill="none"/>
    <circle cx="432" cy="372" r="6" fill="#38bdf8"/>
  </g>

  <!-- Central Emblem Shield -->
  <circle cx="256" cy="256" r="140" fill="#090d16" stroke="url(#gold)" stroke-width="8" filter="url(#glow)"/>

  <!-- High-Voltage Bolt -->
  <path d="M 276 150 L 196 266 L 246 266 L 236 362 L 316 246 L 266 246 Z" 
        fill="url(#gold)" 
        stroke="#fffbeb" 
        stroke-width="3" 
        stroke-linejoin="round"/>
</svg>
